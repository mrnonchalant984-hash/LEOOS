name: Cloudflare Workers preview worker

on:
  push:
    branches:
      - test/cloudflare-workers-smoke
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leonardx-cloudflare-preview-worker
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate protected worker configuration
        id: config
        env:
          LEONARDX_BASE_URL: ${{ secrets.LEONARDX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_PREFIX: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LEONARDX_BASE_URL" || -z "$CRON_SECRET" || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_WORKER_PREFIX" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare Workers preview worker is not configured; no jobs were processed.'
            exit 0
          fi
          [[ -n "$LEONARDX_BASE_URL" && "$LEONARDX_BASE_URL" == https://* ]] || { echo 'LEONARDX_BASE_URL must be an HTTPS URL.' >&2; exit 1; }
          [[ -n "$CRON_SECRET" && ${#CRON_SECRET} -ge 32 ]] || { echo 'CRON_SECRET must be configured and at least 32 characters.' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_WORKER_PREFIX" ]] || { echo 'Cloudflare API token, account ID, and Worker name prefix must be configured.' >&2; exit 1; }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Claim, build, and deploy one bounded Worker preview
        if: steps.config.outputs.ready == 'true'
        env:
          LEONARDX_BASE_URL: ${{ secrets.LEONARDX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_PREFIX: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/cloudflare-preview-worker.mjs
