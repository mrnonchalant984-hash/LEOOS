name: Cloudflare Workers preview worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leonardx-cloudflare-preview-worker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate protected worker configuration
        env:
          LEONARDX_BASE_URL: ${{ secrets.LEONARDX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_PREFIX: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in LEONARDX_BASE_URL CRON_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_PREFIX; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Required Cloudflare preview worker secrets are missing: %s\\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$LEONARDX_BASE_URL" == https://* ]] || { echo 'LEONARDX_BASE_URL must be HTTPS.' >&2; exit 1; }
          [[ ${#CRON_SECRET} -ge 32 ]] || { echo 'CRON_SECRET must contain at least 32 characters.' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID is invalid.' >&2; exit 1; }
          [[ "$CLOUDFLARE_WORKER_PREFIX" =~ ^[a-z0-9]([a-z0-9-]{0,56}[a-z0-9])?$ ]] || { echo 'CLOUDFLARE_PAGES_PROJECT secret must be a valid Worker prefix.' >&2; exit 1; }
      - name: Claim, build, deploy, and verify one preview
        env:
          LEONARDX_BASE_URL: ${{ secrets.LEONARDX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_PREFIX: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/cloudflare-preview-worker.mjs
