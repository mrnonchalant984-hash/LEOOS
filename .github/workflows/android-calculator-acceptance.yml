name: Android calculator APK acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-calculator-acceptance.yml'
      - 'lib/android-build.ts'
      - 'scripts/generate-android-calculator.mjs'
      - 'tests/android-build.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-calculator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Run calculator project and APK validation tests
        run: node --experimental-strip-types --test tests/android-build.test.mjs

      - name: Generate calculator project from MCP implementation
        run: node --experimental-strip-types scripts/generate-android-calculator.mjs "$RUNNER_TEMP/leonardx-calculator"

      - name: Build real debug APK
        working-directory: ${{ runner.temp }}/leonardx-calculator
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK archive and SHA-256
        id: verify
        shell: bash
        run: |
          apk="$RUNNER_TEMP/leonardx-calculator/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c '%s' "$apk")" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leonardx-calculator-debug-${{ github.sha }}
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish build details
        env:
          APK_SIZE: ${{ steps.verify.outputs.apk_size }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        run: |
          {
            echo '## Android calculator APK verified'
            echo "- Size: ${APK_SIZE} bytes"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo '- Download: use the `leonardx-calculator-debug-${GITHUB_SHA}` artifact attached to this workflow run.'
          } >> "$GITHUB_STEP_SUMMARY"
