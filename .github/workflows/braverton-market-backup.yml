name: Braverton Market encrypted backups
on:
  push:
    branches: [braverton-market-launch-readiness]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: braverton-market-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client awscli
      - name: Verify backup configuration
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKETS: ${{ vars.SUPABASE_STORAGE_BUCKETS }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for key in SUPABASE_DB_URL SUPABASE_STORAGE_S3_ENDPOINT SUPABASE_STORAGE_S3_ACCESS_KEY_ID SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY SUPABASE_STORAGE_BUCKETS BACKUP_AGE_RECIPIENT BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            echo "Backup was NOT run. Missing GitHub secrets/variables: ${missing[*]}"
            echo "::warning title=Backup configuration incomplete::Missing GitHub secrets/variables: ${missing[*]}"
            echo "Backup was NOT run. Missing GitHub secrets/variables: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report readiness-branch configuration only
        if: steps.config.outputs.configured == 'true' && github.ref != 'refs/heads/main'
        run: echo "Backup credentials are present. No production backup was run from the readiness branch; the scheduled backup job runs on main only." >> "$GITHUB_STEP_SUMMARY"
      - name: Create and upload encrypted database and Storage backup
        if: steps.config.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKETS: ${{ vars.SUPABASE_STORAGE_BUCKETS }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_RETENTION_DAYS: '90'
        run: bash scripts/braverton-backup.sh
