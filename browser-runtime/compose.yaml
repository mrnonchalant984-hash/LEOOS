services:
  bram-browser-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8787"
      BRAM_BROWSER_RUNTIME_TOKEN: ${BRAM_BROWSER_RUNTIME_TOKEN:?set a long random token}
      BRAM_BROWSER_MAX_SESSIONS: "3"
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/pwuser/.cache:size=128m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
