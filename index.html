  <style>
    :root{--bg:#000;--fg:#fff;--pad-x:clamp(20px,6.95vw,120px)}

    @media (prefers-reduced-motion:reduce){.nav-links a:after,.arrow,.cta{transition:none}}

    </div>
  </section>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';

    const MODEL_URL='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
    const canvas=document.querySelector('#scene'), hero=document.querySelector('#hero'), loaderEl=document.querySelector('#loader');

    const bgCanvas=document.createElement('canvas'), bgCtx=bgCanvas.getContext('2d'); const bgTexture=new THREE.CanvasTexture(bgCanvas); bgTexture.colorSpace=THREE.SRGBColorSpace; bgTexture.minFilter=THREE.LinearFilter; bgTexture.magFilter=THREE.LinearFilter; bgTexture.generateMipmaps=false;
    const bgSceneMaterial=new THREE.ShaderMaterial({uniforms:{uTex:{value:bgTexture}},vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:'uniform sampler2D uTex; varying vec2 vUv; void main(){gl_FragColor=texture2D(uTex,vUv);\n#include <colorspace_fragment>\n}',depthTest:false,depthWrite:false});

    const rtBack=new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType}); const rtFront=new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType});
    const glassVertex=`varying vec3 vNormal; varying vec3 vEye; void main(){vec4 worldPos=modelMatrix*vec4(position,1.);vec4 mvPos=viewMatrix*worldPos;gl_Position=projectionMatrix*mvPos;vNormal=normalize(normalMatrix*normal);vEye=normalize(mvPos.xyz);}`;
    const glassFragment=`uniform sampler2D uTexture; uniform vec2 uResolution; uniform float uBackside,uRefractPower,uChromatic,uSaturation,uShininess,uDiffuseness,uFresnelPower; uniform vec3 uLight; varying vec3 vNormal; varying vec3 vEye;
      float specular(vec3 light,float shininess,float diffuseness){vec3 l=normalize(-light),v=normalize(-vEye),h=normalize(l+v);return pow(max(dot(normalize(vNormal),h),0.),shininess)+max(0.,dot(normalize(vNormal),l))*diffuseness;}
      void main(){vec2 uv=gl_FragCoord.xy/uResolution;vec3 n=normalize(vNormal);if(uBackside>.5)n=-n;vec3 eye=normalize(vEye);float iorR=1.15,iorY=1.16,iorG=1.18,iorC=1.22,iorB=1.22,iorP=1.22;vec3 color=vec3(0.);const float LOOP=16.;
        for(float i=0.;i<LOOP;i++){float slide=i/LOOP*.045;vec2 rr=uv+refract(eye,n,1./iorR).xy*(uRefractPower+slide)*uChromatic;vec2 yy=uv+refract(eye,n,1./iorY).xy*(uRefractPower+slide)*uChromatic;vec2 gg=uv+refract(eye,n,1./iorG).xy*(uRefractPower+slide*2.)*uChromatic;vec2 cc=uv+refract(eye,n,1./iorC).xy*(uRefractPower+slide*2.5)*uChromatic;vec2 bb=uv+refract(eye,n,1./iorB).xy*(uRefractPower+slide*3.)*uChromatic;vec2 pp=uv+refract(eye,n,1./iorP).xy*(uRefractPower+slide)*uChromatic;vec3 r=texture2D(uTexture,rr).rgb, y=texture2D(uTexture,yy).rgb,g=texture2D(uTexture,gg).rgb,c=texture2D(uTexture,cc).rgb,b=texture2D(uTexture,bb).rgb,p=texture2D(uTexture,pp).rgb;float R=r.r*.5+(2.*p.b+2.*y.r-c.r)/3.;float G=g.g*.5+(2.*y.g+2.*c.g-p.g)/3.;float B=b.b*.5+(2.*c.b+2.*p.r-y.b)/3.;color+=vec3(R,G,B);}color/=LOOP;float lum=dot(color,vec3(.2125,.7154,.0721));color=mix(vec3(lum),color,uSaturation);float s=specular(uLight,uShininess,uDiffuseness)+.6*specular(vec3(1.,1.,-1.),uShininess*.6,uDiffuseness*.5);color+=s*(uBackside>.5?.35:1.);float f=pow(1.+dot(eye,n),uFresnelPower);color=mix(color,vec3(1.),f*(uBackside>.5?.25:.55));color+=vec3(.004,.005,.007);gl_FragColor=vec4(color,1.);\n#include <colorspace_fragment>\n}`;
    const glassUniforms=(back=false)=>({uTexture:{value:null},uResolution:{value:new THREE.Vector2(1,1)},uBackside:{value:back?1:0},uRefractPower:{value:back?.22:.30},uChromatic:{value:.5},uSaturation:{value:1.08},uShininess:{value:90},uDiffuseness:{value:.02},uFresnelPower:{value:5},uLight:{value:new THREE.Vector3(-1,1,1)}});
    const backMat=new THREE.ShaderMaterial({uniforms:glassUniforms(true),vertexShader:glassVertex,fragmentShader:glassFragment,side:THREE.BackSide}); const frontMat=new THREE.ShaderMaterial({uniforms:glassUniforms(false),vertexShader:glassVertex,fragmentShader:glassFragment,side:THREE.FrontSide});
    let cube,backCube,dragging=false,lastX=0,lastY=0,velocity=new THREE.Vector2(),lastDrag=0,remaining=0,loaded=false;
    backMat.uniforms.uTexture.value=rtBack.texture;frontMat.uniforms.uTexture.value=rtFront.texture;
    function addGeometry(g){g.deleteAttribute('uv');g.deleteAttribute('color');g.deleteAttribute('tangent');g=mergeVertices(g,1e-4);g.computeVertexNormals();g.computeBoundingBox();const centre=g.boundingBox.getCenter(new THREE.Vector3());g.translate(-centre.x,-centre.y,-centre.z);const size=g.boundingBox.getSize(new THREE.Vector3());const scale=1/Math.max(size.x,size.y,size.z);g.scale(scale,scale,scale);cube=new THREE.Mesh(g,frontMat);backCube=new THREE.Mesh(g.clone(),backMat);cube.visible=false;spinner.add(backCube,cube);loaded=true;loaderEl.classList.add('done');layout();}
    new GLTFLoader().load(MODEL_URL,gltf=>{const parts=[];gltf.scene.traverse(o=>{if(o.isMesh){o.updateWorldMatrix(true,false);const g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);parts.push(g);}});if(parts.length)addGeometry(mergeGeometries(parts,true));else addFallback();},undefined,()=>addFallback());
    function addFallback(){addGeometry(new RoundedBoxGeometry(1,1,1,8,.12));}
    function drawHeadline(){const W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;bgCanvas.width=Math.floor(W*dpr);bgCanvas.height=Math.floor(H*dpr);bgCtx.setTransform(dpr,0,0,dpr,0,0);bgCtx.fillStyle='#000';bgCtx.fillRect(0,0,W,H);const mobile=W<768||W/H<1;let fs=Math.min(H*.21,W*(mobile?.21:.118));bgCtx.font=`800 ${fs}px Poppins`;const lines=['Explore','New','Ideas'];const widest=Math.max(...lines.map(x=>bgCtx.measureText(x).width));if(widest>W*(mobile?.9:.5))fs*=W*(mobile?.9:.5)/widest;bgCtx.font=`800 ${fs}px Poppins`;bgCtx.textAlign='center';bgCtx.textBaseline='alphabetic';bgCtx.fillStyle='#e9e9e9';const cx=W*(mobile?.5:.505),cy=H*(mobile?.45:.468),cap=fs*.7,gap=fs*1.07;lines.forEach((line,i)=>bgCtx.fillText(line,cx,cy+cap/2+(i-1)*gap));bgTexture.needsUpdate=true;}
    function layout(){const W=innerWidth,H=innerHeight,aspect=W/H;renderer.setSize(W,H,false);camera.aspect=aspect;camera.updateProjectionMatrix();const px=W*(devicePixelRatio||1),py=H*(devicePixelRatio||1);rtBack.setSize(px,py);rtFront.setSize(px,py);backMat.uniforms.uResolution.value.set(px,py);frontMat.uniforms.uResolution.value.set(px,py);drawHeadline();const visH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*10,visW=visH*aspect,mobile=W<768||W/H<1,sx=mobile?.5:.517,sy=mobile?.45:.488;pivot.position.set((sx-.5)*visW,(.5-sy)*visH,0);const edge=Math.min(H*.44,W*(mobile?.45:.29));pivot.scale.setScalar(edge/H*visH);}
    function rotateBy(delta){remaining+=delta;velocity.set(0,0);lastDrag=performance.now();}
    function pointerDown(e){dragging=true;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);lastX=e.clientX;lastY=e.clientY;velocity.set(0,0);remaining=0;lastDrag=performance.now();}
    function pointerMove(e){if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dx*.008));spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),dy*.008));velocity.set(dx*.008,dy*.008);lastX=e.clientX;lastY=e.clientY;lastDrag=performance.now();}

    canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
    document.querySelector('#prev').onclick=()=>rotateBy(-Math.PI/2);document.querySelector('#next').onclick=()=>rotateBy(Math.PI/2);document.querySelectorAll('.dot').forEach(dot=>dot.addEventListener('click',()=>{document.querySelectorAll('.dot').forEach(x=>{x.classList.remove('active');x.removeAttribute('aria-current')});dot.classList.add('active');dot.setAttribute('aria-current','true')}));
    document.fonts?.ready.then(()=>{drawHeadline();layout()});window.addEventListener('resize',layout,{passive:true});layout();
    let previous=performance.now();function frame(now){const dt=Math.min((now-previous)/1000,.05);previous=now;if(!dragging&&loaded){if(Math.abs(remaining)>.0005){const step=remaining*Math.min(1,.09*dt*60);spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),step));remaining-=step;}else{spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),velocity.x));spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),velocity.y));const damp=Math.pow(.94,dt*60);velocity.multiplyScalar(damp);const idle=Math.min(1,Math.max(0,(now-lastDrag-600)/1000));spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),.0035*idle));spinner.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),.0012*idle));}}
      renderer.setRenderTarget(rtBack);renderer.clear();renderer.render(bgScene,camera);renderer.setRenderTarget(rtFront);renderer.clear();renderer.render(bgScene,camera);if(backCube){backCube.visible=true;cube.visible=false;}renderer.autoClear=false;renderer.clearDepth();renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.clear();renderer.render(bgScene,camera);if(backCube){backCube.visible=false;cube.visible=true;}renderer.clearDepth();renderer.render(scene,camera);renderer.autoClear=true;requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
